<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>حديقة المقاطع السحرية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@600;800&display=swap" rel="stylesheet">
<style>
/* VOICE: playful, warm, wordless-first for KG1 (icons + very short vowelled Arabic)
   IDEA: a magic garden pop-up storybook where every syllable lives in a flower pot
   PICTURE: layered 3D-shaded garden (sky, hills, round trees), Zozo the giraffe, glossy flowers
   COLOUR and TYPE: sky blue, fresh grass green, sunshine yellow accent; Baloo Bhaijaan 2 large
   LAYOUT: landscape stage; HUD on top, play area centre, Zozo guiding from the right */
:root{color-scheme:light;--ink:#3a2412;--sun:#ffd23f;--grass:#4cb83a}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;overflow:hidden}
body{font-family:'Baloo Bhaijaan 2',Tahoma,Arial,sans-serif;color:var(--ink);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible{outline:4px solid #fff;outline-offset:4px;border-radius:24px}
#g{position:fixed;inset:0;overflow:hidden;background:linear-gradient(#5fc2ff 0%,#a8e4ff 45%,#e2f8ff 64%)}
/* scenery */
.sun{position:absolute;top:4vh;left:5vw;width:13vmin;height:13vmin;border-radius:50%;background:radial-gradient(circle at 38% 35%,#fffbd0,#ffe44d 45%,#ffb300);box-shadow:0 0 6vmin #fff3a0}
.cloud{position:absolute;width:22vmin;height:7vmin;border-radius:7vmin;background:radial-gradient(ellipse at 50% 25%,#fff,#e9f6ff);box-shadow:0 1.2vmin 2vmin #0001;animation:drift 40s linear infinite alternate}
.cloud::before,.cloud::after{content:"";position:absolute;border-radius:50%;background:radial-gradient(circle at 45% 30%,#fff,#eaf6ff)}
.cloud::before{width:10vmin;height:10vmin;top:-5vmin;left:3vmin}.cloud::after{width:8vmin;height:8vmin;top:-3.5vmin;left:10vmin}
@keyframes drift{to{transform:translateX(12vw)}}
.hill{position:absolute;border-radius:50%;bottom:-30vh}
.h1{width:80vw;height:60vh;left:-15vw;background:radial-gradient(ellipse at 45% 20%,#a7ec7f,#5cbf42 55%,#3c9a2c)}
.h2{width:90vw;height:58vh;right:-20vw;background:radial-gradient(ellipse at 50% 18%,#b8f08c,#6ccb4c 55%,#45a634)}
.ground{position:absolute;inset:auto 0 0 0;height:30vh;background:radial-gradient(ellipse at 50% 0%,#8fe063,#58bb3f 50%,#3c9a2c);box-shadow:inset 0 2vh 3vh #ffffff40}
.tree{position:absolute;bottom:24vh;width:16vmin;height:24vmin}
.tree i{position:absolute;border-radius:50%;background:radial-gradient(circle at 35% 30%,#a9f07a,#4fb63a 55%,#2b7f22);box-shadow:0 1vmin 2vmin #0002}
.tree b{position:absolute;bottom:0;left:42%;width:16%;height:40%;border-radius:2vmin;background:linear-gradient(90deg,#8a5a2b,#c48a4f 45%,#6d4320)}
.tree i:nth-child(1){width:70%;height:50%;left:15%;top:0}.tree i:nth-child(2){width:60%;height:45%;left:0;top:25%}.tree i:nth-child(3){width:60%;height:45%;right:0;top:22%}
.tree .ap{position:absolute;width:2.6vmin;height:2.6vmin;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#ff5a5a 35%,#c21d2d);z-index:2}
.deco{position:absolute;bottom:3vh;font-size:5vmin;filter:drop-shadow(0 .6vmin .5vmin #0003)}
/* HUD */
.hud{position:absolute;top:1.5vh;inset-inline:2vw;display:flex;justify-content:space-between;align-items:center;z-index:5;pointer-events:none}
.stages{display:flex;gap:1.2vmin}
.stg{width:8vmin;height:8vmin;min-width:46px;min-height:46px;border-radius:50%;display:grid;place-items:center;font-size:4vmin;background:radial-gradient(circle at 35% 30%,#fff,#e3f1ff 60%,#b9d6ee);box-shadow:0 .8vmin 0 #8fb3d1,0 1.2vmin 2vmin #0002;opacity:.55;position:relative}
.stg.on{opacity:1;transform:scale(1.15);background:radial-gradient(circle at 35% 30%,#fff,#fff3a6 55%,#ffcc2e);box-shadow:0 .8vmin 0 #d99a00,0 1.2vmin 2vmin #0003}
.stg.done{opacity:1}.stg.done::after{content:"✔";position:absolute;bottom:-.6vmin;left:-.6vmin;width:3.6vmin;height:3.6vmin;min-width:20px;min-height:20px;border-radius:50%;background:#3cb83a;color:#fff;font-size:2.2vmin;display:grid;place-items:center}
.stars{display:flex;align-items:center;gap:1vmin;padding:.6vmin 2.4vmin;border-radius:5vmin;background:radial-gradient(circle at 40% 20%,#fff,#fff6c8);box-shadow:0 .8vmin 0 #e0b100,0 1.2vmin 2vmin #0002;font-size:4.6vmin;font-weight:800}
.stars span{display:inline-block}.stars.pop span{animation:pop .5s}
@keyframes pop{50%{transform:scale(1.6) rotate(20deg)}}
/* Zozo */
#zozo{position:absolute;right:1.5vw;bottom:2vh;width:clamp(110px,17vw,240px);z-index:4;transform-origin:50% 100%}
#zozo svg{width:100%;display:block;filter:drop-shadow(0 1.5vmin 1.2vmin #0003)}
#zozo.jump{animation:jump 1s ease}#zozo.tilt{animation:tilt .8s ease}
@keyframes jump{0%,100%{transform:none}25%{transform:translateY(-28%) rotate(-5deg)}50%{transform:none}70%{transform:translateY(-10%) rotate(3deg)}}
@keyframes tilt{30%{transform:rotate(-6deg)}65%{transform:rotate(5deg)}}
.blink{animation:blink 4s infinite;transform-origin:center;transform-box:fill-box}
@keyframes blink{0%,94%,100%{transform:none}97%{transform:scaleY(.1)}}
#say{position:absolute;right:calc(clamp(110px,17vw,240px) + 1vw);bottom:calc(clamp(110px,17vw,240px)*1.1);max-width:36vw;padding:1.2vmin 2.4vmin;border-radius:3vmin;background:#fff;box-shadow:0 1vmin 2vmin #0002;font-size:clamp(17px,3vmin,30px);font-weight:800;line-height:1.7;z-index:4}
#say::after{content:"";position:absolute;right:-1.4vmin;bottom:2vmin;border:1.6vmin solid transparent;border-left-color:#fff;border-right:0}
#say b{color:#d6266f;font-size:1.3em}
/* play area */
#play{position:absolute;top:12vh;bottom:2vh;left:2vw;right:calc(clamp(110px,17vw,240px) + 3vw);display:flex;flex-direction:column;align-items:center;justify-content:space-around;z-index:3}
.target{display:flex;align-items:center;gap:2vmin;padding:.5vmin 6vmin;border-radius:12vmin;background:radial-gradient(ellipse at 50% 20%,#fff,#eef8ff 70%,#d4ecff);box-shadow:0 1.2vmin 0 #a9cbe6,0 2vmin 3vmin #0002;font-size:clamp(48px,11vmin,120px);font-weight:800;line-height:1.5;color:#7a2fd0;animation:bob 3s ease-in-out infinite}
.target small{font-size:.45em}
@keyframes bob{50%{transform:translateY(-1.2vmin)}}
.row{display:flex;justify-content:center;align-items:flex-end;gap:4vw;width:100%}
.fl{display:flex;flex-direction:column;align-items:center;width:clamp(110px,19vw,230px)}
.fl svg{width:100%;display:block;overflow:visible;filter:drop-shadow(0 1vmin .8vmin #0002)}
.sway{transform-origin:50% 100%;animation:sway 4s ease-in-out infinite}
.fl:nth-child(2) .sway{animation-delay:-1.3s}.fl:nth-child(3) .sway{animation-delay:-2.6s}
@keyframes sway{50%{transform:rotate(2.5deg)}}
.bud{transition:opacity .4s,transform .5s;transform-origin:100px 100px;transform-box:view-box}
.bloom{transition:transform .7s cubic-bezier(.3,1.6,.5,1),opacity .3s;transform:scale(.15);opacity:0;transform-origin:100px 85px;transform-box:view-box}
.open .bud{opacity:0;transform:scale(.4)}.open .bloom{transform:none;opacity:1}
.pot{position:relative;margin-top:-1vmin;width:85%;padding:.3vmin 0 1vmin;border-radius:1.5vmin 1.5vmin 5vmin 5vmin;text-align:center;background:linear-gradient(90deg,#b55a2c,#e88a52 35%,#f5a46c 50%,#c96a35 80%,#9c4a22);box-shadow:inset 0 -1.5vmin 2vmin #0003,0 1.5vmin 1.5vmin #0003;font-size:clamp(40px,8vmin,84px);font-weight:800;line-height:1.5;color:#fff;text-shadow:0 .5vmin 0 #8a3d18}
.pot::before{content:"";position:absolute;top:-1.6vmin;left:-5%;right:-5%;height:3vmin;border-radius:1.5vmin;background:linear-gradient(90deg,#a54f25,#f0975e 45%,#b85d2e)}
.pot span{position:relative}
.shake{animation:shake .6s}
@keyframes shake{20%{transform:translateX(-12px) rotate(-3deg)}40%{transform:translateX(10px) rotate(3deg)}60%{transform:translateX(-7px)}80%{transform:translateX(5px)}}
.prog{display:flex;gap:1.4vmin}
.prog i{width:2.6vmin;height:2.6vmin;min-width:14px;min-height:14px;border-radius:50%;background:#ffffffa0;box-shadow:inset 0 .3vmin .4vmin #0002}
.prog i.ok{background:radial-gradient(circle at 35% 30%,#fff,#ffd23f 45%,#f59f00)}
.bfly{position:fixed;width:11vmin;z-index:9;pointer-events:none;translate:-50% -50%;animation:fly 2.6s ease-in forwards}
.bfly svg{width:100%;overflow:visible}
.wl,.wr{transform-origin:50px 40px;transform-box:view-box;animation:flap .25s ease-in-out infinite}
@keyframes flap{50%{transform:scaleX(.25)}}
@keyframes fly{0%{transform:scale(.3)}20%{transform:scale(1.2) translate(2vw,-8vh)}50%{transform:translate(-4vw,-25vh) rotate(-10deg)}100%{transform:translate(var(--dx),-75vh) rotate(15deg) scale(.7);opacity:0}}
/* stage 2 */
.duo{display:flex;align-items:center;justify-content:center;gap:6vw;width:100%;flex:1}
.pic{display:flex;flex-direction:column;align-items:center;gap:1vmin}
.globe{width:clamp(150px,30vmin,300px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-size:clamp(84px,17vmin,170px);background:radial-gradient(circle at 35% 25%,#fff,#fff8e0 45%,#ffe08a 80%,#f5c242);box-shadow:inset -2vmin -2.5vmin 4vmin #e0a10055,0 2vmin 3vmin #0003}
.globe span{filter:drop-shadow(0 1.4vmin 1vmin #0004);transition:transform .5s}
.pic.win .globe span{transform:scale(1.15) rotate(-6deg)}
.word{padding:0 4vmin;border-radius:4vmin;background:#fff;box-shadow:0 1vmin 0 #d6c3a4,0 1.4vmin 2vmin #0002;font-size:clamp(40px,8vmin,80px);font-weight:800;line-height:1.6}
.word em{font-style:normal;color:#e0217a}
.opts{display:flex;flex-direction:column;gap:2.4vmin}
.opt{width:clamp(130px,24vmin,240px);padding:.4vmin 0;border-radius:6vmin;font-size:clamp(42px,8.5vmin,88px);font-weight:800;line-height:1.5;color:#fff;text-shadow:0 .5vmin 0 #0003;box-shadow:inset 0 -1.4vmin 2vmin #0003,inset 0 1vmin 1.5vmin #ffffff80,0 1.2vmin 0 var(--d),0 2vmin 2.5vmin #0003;background:radial-gradient(ellipse at 50% 15%,#ffffffb0,transparent 45%),var(--c);transition:transform .15s}
.opt:active{transform:translateY(.6vmin)}
.opt.ok{--c:#3cc04a;--d:#23812d;transform:scale(1.08)}
/* stage 3 */
.hive{display:flex;flex-wrap:wrap;justify-content:center;gap:2vmin 3vw;min-height:24vmin;align-items:center}
.bee{width:clamp(92px,15vmin,150px);display:flex;flex-direction:column;align-items:center;touch-action:none;cursor:grab;animation:hover 2.4s ease-in-out infinite;position:relative;z-index:1}
.bee:nth-child(2n){animation-delay:-1.2s}
.bee.drag{animation:none;cursor:grabbing;z-index:20;transition:none}
.bee.back{transition:transform .45s cubic-bezier(.3,1.5,.5,1)}
.bee svg{width:70%;overflow:visible;filter:drop-shadow(0 1vmin .8vmin #0003);pointer-events:none}
.bee svg .w{transform-origin:50% 100%;transform-box:fill-box;animation:flap .2s infinite}
.bee b{margin-top:-1vmin;padding:0 2.6vmin;border-radius:4vmin;font-size:clamp(34px,6.5vmin,66px);line-height:1.5;color:#5a3200;background:radial-gradient(ellipse at 50% 15%,#fff,#ffe58a 50%,#ffc21a);box-shadow:inset 0 -1vmin 1.4vmin #c8860055,0 .8vmin 0 #c98a00,0 1.4vmin 2vmin #0003;pointer-events:none}
@keyframes hover{50%{transform:translateY(-1.6vmin)}}
.pots{display:flex;justify-content:center;gap:5vw;width:100%}
.dpot{width:clamp(110px,18vw,220px);display:flex;flex-direction:column;align-items:center;border-radius:3vmin;transition:background .2s}
.dpot.over{background:#ffffff60;box-shadow:0 0 0 .6vmin #fff}
.grow{height:12vmin;width:100%;display:flex;justify-content:center;align-items:flex-end;gap:.5vmin}
.grow svg{width:42%;animation:rise .7s cubic-bezier(.3,1.6,.5,1)}
@keyframes rise{from{transform:scale(0) translateY(40%)}}
/* overlays */
.ov{position:absolute;inset:0;z-index:30;display:grid;place-items:center;background:#1b4f7a66;backdrop-filter:blur(3px)}
.card{width:min(560px,90vw);padding:3vmin 4vmin 4vmin;border-radius:5vmin;text-align:center;background:radial-gradient(ellipse at 50% 0%,#fff,#fff9e8 60%,#ffeec0);box-shadow:0 2vmin 0 #e3b64f,0 3vmin 5vmin #0004;animation:in .6s cubic-bezier(.3,1.5,.5,1)}
@keyframes in{from{transform:scale(.4);opacity:0}}
.card .ic{font-size:clamp(60px,14vmin,130px);line-height:1.2;filter:drop-shadow(0 1vmin .8vmin #0003)}
.card h1{margin:0;font-size:clamp(32px,6.5vmin,56px);line-height:1.4;color:#c2185b;text-wrap:balance}
.card h2{margin:0 0 1vmin;font-size:clamp(22px,4.5vmin,38px);line-height:1.4;color:#2e7d32}
.card .syl{display:flex;justify-content:center;gap:2vmin;margin:1vmin 0 2vmin;font-size:clamp(34px,7vmin,64px);font-weight:800;color:#7a2fd0}
.go{display:inline-flex;align-items:center;gap:1.5vmin;margin-top:1vmin;padding:.5vmin 6vmin;min-height:60px;border-radius:6vmin;font-size:clamp(30px,6vmin,54px);font-weight:800;color:#fff;background:radial-gradient(ellipse at 50% 10%,#ffffffa0,transparent 45%),#3cc04a;box-shadow:inset 0 -1.2vmin 1.6vmin #0003,0 1.2vmin 0 #23812d,0 2vmin 2vmin #0003;animation:pulse 1.6s infinite}
@keyframes pulse{50%{transform:scale(1.07)}}
.card .zz{width:clamp(110px,22vmin,190px);margin:0 auto -1vmin}
.big-stars{font-size:clamp(44px,9vmin,80px);letter-spacing:1vmin}
.petal{position:fixed;top:-5vh;z-index:31;font-size:4vmin;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(112vh) rotate(540deg)}}
@media (max-width:700px) and (orientation:portrait){#play{right:2vw;bottom:24vh}#say{max-width:60vw}.row{gap:2vw}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style>
</head>
<body>
<div id="g">
  <div class="sun"></div>
  <div class="cloud" style="top:7vh;left:28vw"></div>
  <div class="cloud" style="top:16vh;left:58vw;transform:scale(.75);animation-duration:55s"></div>
  <div class="hill h1"></div><div class="hill h2"></div>
  <div class="tree" style="left:3vw"><b></b><i></i><i></i><i></i><span class="ap" style="top:20%;left:30%"></span><span class="ap" style="top:40%;left:65%"></span></div>
  <div class="tree" style="left:40vw;transform:scale(.7);bottom:27vh"><b></b><i></i><i></i><i></i><span class="ap" style="top:30%;left:50%"></span></div>
  <div class="ground"></div>
  <div class="deco" style="left:8vw">🍄</div><div class="deco" style="left:30vw">🌼</div><div class="deco" style="left:55vw">🌻</div><div class="deco" style="left:70vw;bottom:9vh">🌷</div>

  <div class="hud">
    <div class="stages"><div class="stg" id="s1">🌷</div><div class="stg" id="s2">🖼️</div><div class="stg" id="s3">🐝</div></div>
    <div class="stars" id="stars"><span>⭐</span><b>0</b></div>
  </div>

  <div id="play"></div>
  <div id="say"></div>
  <div id="zozo">
    <svg viewBox="0 0 200 300" aria-label="زوزو الزرافة">
      <defs>
        <radialGradient id="zb" cx="38%" cy="30%" r="75%"><stop offset="0" stop-color="#fff1b8"/><stop offset=".45" stop-color="#ffcf4d"/><stop offset="1" stop-color="#e59a1c"/></radialGradient>
        <radialGradient id="zs" cx="35%" cy="30%"><stop offset="0" stop-color="#d98a3a"/><stop offset="1" stop-color="#9a5218"/></radialGradient>
        <radialGradient id="zm" cx="40%" cy="30%"><stop offset="0" stop-color="#fff9e6"/><stop offset="1" stop-color="#f5d79a"/></radialGradient>
        <linearGradient id="zl" x1="0" x2="1"><stop offset="0" stop-color="#e59a1c"/><stop offset=".45" stop-color="#ffd768"/><stop offset="1" stop-color="#d98a12"/></linearGradient>
      </defs>
      <ellipse cx="100" cy="292" rx="62" ry="7" fill="#0003"/>
      <g fill="url(#zl)"><rect x="56" y="225" width="16" height="64" rx="8"/><rect x="80" y="230" width="16" height="60" rx="8"/><rect x="110" y="230" width="16" height="60" rx="8"/><rect x="132" y="225" width="16" height="64" rx="8"/></g>
      <g fill="#7a3d10"><rect x="56" y="280" width="16" height="10" rx="5"/><rect x="80" y="281" width="16" height="9" rx="4"/><rect x="110" y="281" width="16" height="9" rx="4"/><rect x="132" y="280" width="16" height="10" rx="5"/></g>
      <path d="M150 205 C172 210 176 228 170 246" stroke="#e59a1c" stroke-width="5" fill="none" stroke-linecap="round"/><circle cx="170" cy="248" r="6" fill="#7a3d10"/>
      <ellipse cx="102" cy="212" rx="60" ry="36" fill="url(#zb)"/>
      <path d="M78 205 C76 160 84 120 92 92 L122 92 C116 125 112 165 122 200 Z" fill="url(#zb)"/>
      <g fill="url(#zs)"><ellipse cx="78" cy="205" rx="11" ry="9"/><ellipse cx="108" cy="220" rx="13" ry="10"/><ellipse cx="135" cy="203" rx="10" ry="8"/><ellipse cx="88" cy="232" rx="8" ry="6"/><ellipse cx="100" cy="160" rx="8" ry="9"/><ellipse cx="104" cy="125" rx="7" ry="8"/><ellipse cx="92" cy="185" rx="6" ry="7"/></g>
      <path d="M118 98 C126 110 128 150 124 185" stroke="#c46a1c" stroke-width="6" stroke-dasharray="6 8" fill="none" stroke-linecap="round"/>
      <g stroke="#c97a1c" stroke-width="6" stroke-linecap="round"><line x1="92" y1="40" x2="88" y2="18"/><line x1="122" y1="40" x2="128" y2="18"/></g>
      <circle cx="88" cy="16" r="8" fill="url(#zs)"/><circle cx="128" cy="16" r="8" fill="url(#zs)"/>
      <ellipse cx="68" cy="50" rx="16" ry="8" fill="url(#zb)" transform="rotate(-25 68 50)"/><ellipse cx="148" cy="48" rx="16" ry="8" fill="url(#zb)" transform="rotate(25 148 48)"/>
      <ellipse cx="108" cy="66" rx="42" ry="36" fill="url(#zb)"/>
      <ellipse cx="110" cy="90" rx="30" ry="20" fill="url(#zm)"/>
      <circle cx="100" cy="88" r="3" fill="#7a3d10"/><circle cx="120" cy="88" r="3" fill="#7a3d10"/>
      <path d="M98 98 Q110 108 122 98" stroke="#7a3d10" stroke-width="3.5" fill="none" stroke-linecap="round"/>
      <ellipse cx="76" cy="80" rx="8" ry="5" fill="#ff8fa8" opacity=".7"/><ellipse cx="142" cy="80" rx="8" ry="5" fill="#ff8fa8" opacity=".7"/>
      <g class="blink"><ellipse cx="92" cy="60" rx="13" ry="15" fill="#fff" stroke="#e0b070" stroke-width="1.5"/><ellipse cx="126" cy="60" rx="13" ry="15" fill="#fff" stroke="#e0b070" stroke-width="1.5"/>
      <circle cx="94" cy="63" r="8.5" fill="#3a2010"/><circle cx="124" cy="63" r="8.5" fill="#3a2010"/>
      <circle cx="97" cy="59" r="3.2" fill="#fff"/><circle cx="127" cy="59" r="3.2" fill="#fff"/><circle cx="92" cy="67" r="1.5" fill="#fff"/><circle cx="122" cy="67" r="1.5" fill="#fff"/></g>
      <ellipse cx="96" cy="44" rx="14" ry="6" fill="#fff" opacity=".35"/>
    </svg>
  </div>
</div>

<script>
{
const S=['زا','زو','زي'];
const COL=[['#ff8ec4','#e0337a'],['#c2a0ff','#7448e0'],['#ffc163','#f07a12']];
const OPT=[['#ff6fae','#c51f66'],['#9b72ff','#5a2fc9'],['#ff9f2e','#c96a00']];
const WORDS=[
  {p:'🦌',a:'غ',s:'زا',b:'ل'},{p:'⚖️',a:'مي',s:'زا',b:'ن'},
  {p:'🚤',a:'',s:'زو',b:'رق'},{p:'🦒',a:'',s:'زو',b:'زو'},
  {p:'🎊',a:'',s:'زي',b:'نة'},{p:'🏺',a:'',s:'زي',b:'ر'}];
const $=q=>document.querySelector(q);
const G=$('#g'),play=$('#play'),zozo=$('#zozo'),say=$('#say'),starsEl=$('#stars');
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
let stars=0,gid=0;
const restart=(el,c)=>{el.classList.remove(c);void el.offsetWidth;el.classList.add(c)};
const happy=()=>restart(zozo,'jump');
const hmm=()=>restart(zozo,'tilt');
const shake=el=>restart(el,'shake');
const speak=h=>say.innerHTML=h;
function addStar(){stars++;starsEl.querySelector('b').textContent=stars;restart(starsEl,'pop')}
function setHud(n){[1,2,3].forEach(i=>{const e=$('#s'+i);e.classList.toggle('on',i===n);e.classList.toggle('done',i<n)})}
const dots=(n,k)=>`<div class="prog">${Array.from({length:n},(_,i)=>`<i class="${i<k?'ok':''}"></i>`).join('')}</div>`;

function flowerSVG(c,open){const id='f'+(gid++);return `<svg viewBox="0 0 200 230" aria-hidden="true"><defs>
<radialGradient id="${id}p" cx="40%" cy="30%" r="75%"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset=".3" stop-color="${c[0]}"/><stop offset="1" stop-color="${c[1]}"/></radialGradient>
<radialGradient id="${id}c" cx="38%" cy="32%"><stop offset="0" stop-color="#fff8c0"/><stop offset=".5" stop-color="#ffd400"/><stop offset="1" stop-color="#e08a00"/></radialGradient>
<linearGradient id="${id}s" x1="0" x2="1"><stop offset="0" stop-color="#9ae878"/><stop offset=".5" stop-color="#4cb83a"/><stop offset="1" stop-color="#2d8a24"/></linearGradient></defs>
<path d="M98 230 C95 190 105 150 100 100" stroke="url(#${id}s)" stroke-width="12" fill="none" stroke-linecap="round"/>
<path d="M98 190 C70 162 44 172 34 184 C56 200 82 200 98 190Z" fill="url(#${id}s)"/>
<path d="M100 168 C128 142 154 150 166 160 C146 178 120 178 100 168Z" fill="url(#${id}s)"/>
${open?'':`<g class="bud"><path d="M100 28 C66 56 66 98 100 114 C134 98 134 56 100 28Z" fill="url(#${id}p)"/>
<path d="M100 38 C86 60 86 92 100 112" stroke="${c[1]}" stroke-width="3" fill="none" opacity=".45"/>
<path d="M76 94 C80 112 92 118 100 118 C108 118 120 112 124 94 C112 104 88 104 76 94Z" fill="url(#${id}s)"/>
<ellipse cx="88" cy="58" rx="6" ry="14" fill="#fff" opacity=".45" transform="rotate(20 88 58)"/></g>`}
<g class="bloom" ${open?'style="transform:none;opacity:1"':''}>${[0,60,120,180,240,300].map(a=>`<ellipse cx="100" cy="44" rx="25" ry="38" fill="url(#${id}p)" transform="rotate(${a} 100 85)"/>`).join('')}
<circle cx="100" cy="85" r="25" fill="url(#${id}c)"/><circle cx="92" cy="77" r="7" fill="#fff" opacity=".7"/></g></svg>`}

function butterfly(el){
  const r=el.getBoundingClientRect(),c=COL[Math.random()*3|0],b=document.createElement('div');
  b.className='bfly';
  b.innerHTML=`<svg viewBox="0 0 100 80"><defs><radialGradient id="bw${gid}" cx="35%" cy="30%"><stop offset="0" stop-color="#fff"/><stop offset=".35" stop-color="${c[0]}"/><stop offset="1" stop-color="${c[1]}"/></radialGradient></defs>
  <g class="wl"><path d="M48 40 C30 0 2 4 8 28 C12 44 34 46 48 42Z" fill="url(#bw${gid})"/><path d="M48 44 C30 50 14 70 28 74 C40 76 46 60 48 46Z" fill="url(#bw${gid})"/></g>
  <g class="wr"><path d="M52 40 C70 0 98 4 92 28 C88 44 66 46 52 42Z" fill="url(#bw${gid})"/><path d="M52 44 C70 50 86 70 72 74 C60 76 54 60 52 46Z" fill="url(#bw${gid})"/></g>
  <ellipse cx="50" cy="44" rx="4" ry="18" fill="#4a2a10"/><circle cx="50" cy="24" r="5" fill="#4a2a10"/>
  <path d="M48 20 Q42 8 38 6 M52 20 Q58 8 62 6" stroke="#4a2a10" stroke-width="2" fill="none"/></svg>`;
  gid++;
  b.style.left=r.left+r.width/2+'px';b.style.top=r.top+r.height*.3+'px';
  b.style.setProperty('--dx',(Math.random()*30-15)+'vw');
  document.body.appendChild(b);setTimeout(()=>b.remove(),2700);
}

function intro(n,icon,title,cb){
  setHud(n);play.innerHTML='';speak('');
  const ov=document.createElement('div');ov.className='ov';
  ov.innerHTML=`<div class="card"><div class="ic">${icon}</div><h2>المرحلة ${['','الأولى','الثانية','الثالثة'][n]}</h2><h1>${title}</h1>
  <div class="syl">${S.map(s=>`<span>${s}</span>`).join('')}</div><button class="go" aria-label="ابدأ">▶ هيا</button></div>`;
  G.appendChild(ov);ov.querySelector('.go').onclick=()=>{ov.remove();cb()};
}

/* المرحلة 1: أزهار المقاطع */
function stage1(){
  const order=shuffle([...S,...S]);let r=0;
  const round=()=>{
    if(r>=order.length)return intro(2,'🖼️','صور المقاطع',stage2);
    const t=order[r];
    play.innerHTML=`<div class="target"><small>🔎</small><span>${t}</span></div>
    <div class="row">${shuffle(S).map((s,i)=>`<button class="fl" data-s="${s}" aria-label="${s}"><div class="sway">${flowerSVG(COL[i])}</div><div class="pot"><span>${s}</span></div></button>`).join('')}</div>${dots(order.length,r)}`;
    speak(`👆 اضغط <b>${t}</b>`);
    let done=false;
    play.querySelectorAll('.fl').forEach(b=>b.onclick=()=>{
      if(done)return;
      if(b.dataset.s===t){done=true;b.classList.add('open');butterfly(b);happy();addStar();speak('🦋 أحسنت!');setTimeout(()=>{r++;round()},2000)}
      else{shake(b);hmm();speak(`🤔 حاول مرة أخرى`)}
    });
  };
  round();
}

/* المرحلة 2: الصورة والمقطع */
function stage2(){
  const order=shuffle(WORDS);let r=0;
  const round=()=>{
    if(r>=order.length)return intro(3,'🐝','نحلات المقاطع',stage3);
    const w=order[r];
    play.innerHTML=`<div class="duo"><div class="pic"><div class="globe"><span>${w.p}</span></div><div class="word">${w.a}<em>${w.s}</em>${w.b}</div></div>
    <div class="opts">${shuffle(S).map((s,i)=>`<button class="opt" data-s="${s}" style="--c:${OPT[i][0]};--d:${OPT[i][1]}">${s}</button>`).join('')}</div></div>${dots(order.length,r)}`;
    speak('👀 انظر ثم 👆 اختر');
    let done=false;
    play.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      if(done)return;
      if(b.dataset.s===w.s){done=true;b.classList.add('ok');play.querySelector('.pic').classList.add('win');butterfly(play.querySelector('.globe'));happy();addStar();speak('🌟 رائع!');setTimeout(()=>{r++;round()},2000)}
      else{shake(b);hmm();speak('🤔 حاول مرة أخرى')}
    });
  };
  round();
}

/* المرحلة 3: اسحب النحلة إلى أصيصها */
const beeSVG=`<svg viewBox="0 0 100 70" aria-hidden="true"><ellipse class="w" cx="40" cy="18" rx="13" ry="17" fill="#e8f7ff" opacity=".85" stroke="#9ccbe8"/><ellipse class="w" cx="60" cy="18" rx="13" ry="17" fill="#e8f7ff" opacity=".85" stroke="#9ccbe8"/>
<defs><radialGradient id="bb" cx="40%" cy="30%"><stop offset="0" stop-color="#fff6b0"/><stop offset=".5" stop-color="#ffd21a"/><stop offset="1" stop-color="#e39b00"/></radialGradient></defs>
<ellipse cx="50" cy="44" rx="30" ry="22" fill="url(#bb)"/><path d="M38 24 Q34 44 38 64 M52 22 Q48 44 52 66" stroke="#3a2410" stroke-width="7" fill="none"/>
<path d="M80 44 L90 46 L80 49Z" fill="#3a2410"/><circle cx="26" cy="38" r="5" fill="#3a2410"/><circle cx="27.5" cy="36.5" r="1.8" fill="#fff"/>
<path d="M22 50 Q27 54 32 50" stroke="#3a2410" stroke-width="2" fill="none" stroke-linecap="round"/><ellipse cx="44" cy="32" rx="9" ry="4" fill="#fff" opacity=".5"/></svg>`;
function stage3(){
  const list=shuffle([...S,...S]);let left=list.length;
  play.innerHTML=`<div class="hive">${list.map(s=>`<div class="bee" data-s="${s}">${beeSVG}<b>${s}</b></div>`).join('')}</div>
  <div class="pots">${shuffle(S).map((s,i)=>`<div class="dpot" data-s="${s}" data-i="${i}"><div class="grow"></div><div class="pot"><span>${s}</span></div></div>`).join('')}</div>`;
  speak('✋ اسحب النحلة ⬇️');
  const pots=[...play.querySelectorAll('.dpot')];
  const hit=(x,y)=>pots.find(p=>{const r=p.getBoundingClientRect();return x>r.left&&x<r.right&&y>r.top&&y<r.bottom});
  play.querySelectorAll('.bee').forEach(bee=>{
    let sx,sy,on=false;
    bee.addEventListener('pointerdown',e=>{on=true;sx=e.clientX;sy=e.clientY;bee.classList.remove('back');bee.classList.add('drag');bee.setPointerCapture(e.pointerId);e.preventDefault()});
    bee.addEventListener('pointermove',e=>{if(!on)return;bee.style.transform=`translate(${e.clientX-sx}px,${e.clientY-sy}px) scale(1.1)`;
      const p=hit(e.clientX,e.clientY);pots.forEach(q=>q.classList.toggle('over',q===p))});
    const end=e=>{if(!on)return;on=false;bee.classList.remove('drag');pots.forEach(q=>q.classList.remove('over'));
      const p=hit(e.clientX,e.clientY);
      if(p&&p.dataset.s===bee.dataset.s){
        bee.remove();p.querySelector('.grow').insertAdjacentHTML('beforeend',flowerSVG(COL[+p.dataset.i],true));
        butterfly(p);happy();addStar();left--;speak('🌸 أحسنت!');
        if(!left)setTimeout(finish,1600);
      }else{
        bee.classList.add('back');bee.style.transform='';
        if(p){shake(p);hmm();speak('🤔 حاول مرة أخرى')}
      }};
    bee.addEventListener('pointerup',end);bee.addEventListener('pointercancel',end);
  });
}

function petals(){for(let i=0;i<28;i++){const p=document.createElement('div');p.className='petal';p.textContent=['🌸','🌼','🦋','⭐','🌷'][i%5];
  p.style.left=Math.random()*100+'vw';p.style.animationDuration=(3+Math.random()*3)+'s';p.style.animationDelay=Math.random()*1.5+'s';
  document.body.appendChild(p);setTimeout(()=>p.remove(),8000)}}

function finish(){
  setHud(4);play.innerHTML='';speak('');petals();
  const ov=document.createElement('div');ov.className='ov';
  ov.innerHTML=`<div class="card"><div class="zz">${zozo.innerHTML}</div><h1>أحسنت يا بطل!</h1>
  <div class="big-stars">⭐⭐⭐</div><div class="syl">${S.map(s=>`<span>${s}</span>`).join('')}</div>
  <h2>⭐ ${stars}</h2><button class="go" aria-label="العب من جديد">🔄 من جديد</button></div>`;
  G.appendChild(ov);ov.querySelector('.go').onclick=()=>{ov.remove();start()};
}

function start(){
  stars=0;starsEl.querySelector('b').textContent=0;setHud(0);play.innerHTML='';speak('');
  const ov=document.createElement('div');ov.className='ov';
  ov.innerHTML=`<div class="card"><div class="zz">${zozo.innerHTML}</div><h1>حديقة المقاطع السحرية</h1>
  <h2>🦒 أنا زوزو!</h2><div class="syl">${S.map(s=>`<span>${s}</span>`).join('')}</div><button class="go" aria-label="ابدأ">▶ هيا</button></div>`;
  G.appendChild(ov);ov.querySelector('.go').onclick=()=>{ov.remove();intro(1,'🌷','أزهار المقاطع',stage1)};
}
start();
}
</script>
</body>
</html>
